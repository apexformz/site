<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-labelledby="title desc"><title id="title">Backhand volley preparation — illustrative position guide</title><desc id="desc">A simplified body-landmark schematic for the experimental Squash position. It is an app-authored illustration, not an expert capture. Racket and ball are not shown or analyzed.</desc><defs><linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#739fe7" stop-opacity=".20"/><stop offset="1" stop-color="#90bbfa" stop-opacity=".05"/></linearGradient></defs><ellipse cx="200" cy="390" rx="130" ry="19" fill="#739fe7" fill-opacity=".08"/><path d="M70 390H330M200 52V390" stroke="#82a9df" stroke-opacity=".22" stroke-dasharray="5 9"/><polygon points="152.0,112.5 248.0,112.5 248.0,225.0 152.0,225.0" fill="url(#body)"/><g stroke="#6c9ce6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><polyline points="132.4,211.5 116.0,160.8 152.0,112.5 152.0,225.0 127.4,301.1 72.2,353.2"/><polyline points="193.1,85.3 197.2,139.1 248.0,112.5 248.0,225.0 272.6,301.1 327.8,353.2"/><polyline points="152.0,112.5 248.0,112.5"/><polyline points="152.0,225.0 248.0,225.0"/><path d="M200 108V92"/></g><circle cx="200" cy="71" r="22" fill="url(#body)" stroke="#6c9ce6" stroke-width="7"/><g fill="#bed5fb" stroke="#5b8bd9" stroke-width="3"><circle cx="152.0" cy="112.5" r="5"/><circle cx="152.0" cy="225.0" r="5"/><circle cx="116.0" cy="160.8" r="5"/><circle cx="132.4" cy="211.5" r="5"/><circle cx="127.4" cy="301.1" r="5"/><circle cx="72.2" cy="353.2" r="5"/><circle cx="248.0" cy="112.5" r="5"/><circle cx="248.0" cy="225.0" r="5"/><circle cx="197.2" cy="139.1" r="5"/><circle cx="193.1" cy="85.3" r="5"/><circle cx="272.6" cy="301.1" r="5"/><circle cx="327.8" cy="353.2" r="5"/></g><text x="200" y="432" text-anchor="middle" fill="#718fba" font-family="Arial,sans-serif" font-size="13">Illustrative guide · Either side may be used</text></svg>