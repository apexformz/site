<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" role="img" aria-labelledby="title desc"><title id="title">Forehand volley preparation — illustrative position guide</title><desc id="desc">A simplified body-landmark schematic for the experimental Squash position. It is an app-authored illustration, not an expert capture. Racket and ball are not shown or analyzed.</desc><defs><linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#739fe7" stop-opacity=".20"/><stop offset="1" stop-color="#90bbfa" stop-opacity=".05"/></linearGradient></defs><ellipse cx="200" cy="390" rx="130" ry="19" fill="#739fe7" fill-opacity=".08"/><path d="M70 390H330M200 52V390" stroke="#82a9df" stroke-opacity=".22" stroke-dasharray="5 9"/><polygon points="152.0,112.5 248.0,112.5 248.0,225.0 152.0,225.0" fill="url(#body)"/><g stroke="#6c9ce6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"><polyline points="143.9,210.9 119.9,164.1 152.0,112.5 152.0,225.0 133.4,303.2 82.5,360.5"/><polyline points="299.6,171.8 303.8,118.0 248.0,112.5 248.0,225.0 266.6,303.2 317.5,360.5"/><polyline points="152.0,112.5 248.0,112.5"/><polyline points="152.0,225.0 248.0,225.0"/><path d="M200 108V92"/></g><circle cx="200" cy="71" r="22" fill="url(#body)" stroke="#6c9ce6" stroke-width="7"/><g fill="#bed5fb" stroke="#5b8bd9" stroke-width="3"><circle cx="152.0" cy="112.5" r="5"/><circle cx="152.0" cy="225.0" r="5"/><circle cx="119.9" cy="164.1" r="5"/><circle cx="143.9" cy="210.9" r="5"/><circle cx="133.4" cy="303.2" r="5"/><circle cx="82.5" cy="360.5" r="5"/><circle cx="248.0" cy="112.5" r="5"/><circle cx="248.0" cy="225.0" r="5"/><circle cx="303.8" cy="118.0" r="5"/><circle cx="299.6" cy="171.8" r="5"/><circle cx="266.6" cy="303.2" r="5"/><circle cx="317.5" cy="360.5" r="5"/></g><text x="200" y="432" text-anchor="middle" fill="#718fba" font-family="Arial,sans-serif" font-size="13">Illustrative guide · Either side may be used</text></svg>