[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apexformz_contracts"
version = "1.0.0"
description = "ApexFormz Brain shared contracts: Pydantic mirror of the JSON Schema source of truth"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0", "jsonschema>=4.18", "referencing>=0.30"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["apexformz_contracts"]

[tool.setuptools.package-data]
apexformz_contracts = ["schemas/*.json"]
